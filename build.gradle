plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Third-party fg.deobf jars often keep SRG names inside mixin refmaps.
            // Remap them to the active mappings (official) at runtime so Architectury/Iron's/etc. can inject.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}



repositories {
    mavenCentral()
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net' }
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Illusive Soulworks (Curios)'; url = 'https://maven.theillusivec4.top/' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'Latvian (KubeJS)'; url = 'https://maven.latvian.dev/releases' }
    maven { name = 'Shadows of Fire'; url = 'https://maven.shadowsoffire.dev/releases' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = "Iron's Maven"; url = 'https://code.redspace.io/releases' }
    maven { name = 'KosmX (PlayerAnimator)'; url = 'https://maven.kosmx.dev/' }
    maven { name = 'Parchment'; url = 'https://maven.parchmentmc.org' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // KubeJS 2001.x — needed at compile time for EventJS / KubeJSPlugin
    compileOnly(fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")) {
        transitive = false
    }
    // Common rhino jar is fine for compile; runtime MUST be rhino-forge (has mods.toml / modId=rhino)
    compileOnly(fg.deobf("dev.latvian.mods:rhino:${rhino_version}")) {
        transitive = false
    }
    compileOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) {
        transitive = false
    }

    // Runtime optional mods for local runClient (transitive false to avoid fabric-loader / bad POMs).
    // Default compatRuntime=full. Use -PcompatRuntime=stable to drop Iron's/Epic Fight if needed.
    def compatRuntime = (findProperty('compatRuntime') ?: 'full').toString()

    // KubeJS stack: kubejs-forge -> rhino-forge + architectury-forge
    runtimeOnly(fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }

    // Apotheosis stack: apotheosis -> attributeslib + placebo
    runtimeOnly(fg.deobf("dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis_version}")) { transitive = false }

    if (compatRuntime == 'full' || compatRuntime == 'irons') {
        // Iron's Spellbooks stack (+ Iron's Lib mandatory since 3.16)
        runtimeOnly(fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}")) { transitive = false }
        runtimeOnly(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")) { transitive = false }
        runtimeOnly(fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")) { transitive = false }
        runtimeOnly(fg.deobf("curse.maven:${irons_lib_curse}")) { transitive = false }
        runtimeOnly(fg.deobf("io.redspace:irons_spellbooks:${irons_version}")) { transitive = false }
    }

    if (compatRuntime == 'full' || compatRuntime == 'epicfight') {
        runtimeOnly(fg.deobf("maven.modrinth:epic-fight:${epicfight_version_id}")) { transitive = false }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Resource token expansion for mods.toml.
// IDEA MatchingCopyAction can only model plain String tokens — never put `project` (or any
// non-String) into expand(). Prefer direct gradle.properties refs over findProperty().
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filteringCharset 'UTF-8'

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// IDEA: use Gradle for build/run so native MatchingCopyAction path is never required.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        inheritOutputDirs = true
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
}
